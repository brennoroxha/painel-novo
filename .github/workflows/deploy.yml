name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets and environment
        run: |
          echo "Docker version:"
          docker --version
          echo "Checking secrets..."
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "❌ ERRO: DOCKER_USERNAME não está configurado!"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "❌ ERRO: DOCKER_PASSWORD não está configurado!"
            exit 1
          fi
          echo "✓ DOCKER_USERNAME está configurado"
          echo "✓ DOCKER_PASSWORD está configurado"
          echo "Image will be: ${{ secrets.DOCKER_USERNAME }}/painel-novo:latest"

      - name: Build Docker image
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "Building image as: $DOCKER_USER/painel-novo:latest"
          docker build -t $DOCKER_USER/painel-novo:latest .
          echo "Build exit code: $?"

      - name: Login and push to Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
          docker push $DOCKER_USER/painel-novo:latest
