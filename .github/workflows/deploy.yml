name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Debug info
        run: |
          echo "Checking Docker..."
          docker --version
          echo "Checking Node..."
          node --version
          echo "Dockerfile exists:"
          ls -lah Dockerfile

      - name: Build Docker image
        run: |
          echo "Starting Docker build for ${{ secrets.DOCKER_USERNAME }}/painel-novo:latest"
          docker build --progress=plain -t ${{ secrets.DOCKER_USERNAME }}/painel-novo:latest .
          BUILD_STATUS=$?
          echo "Docker build completed with status: $BUILD_STATUS"
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "Docker build FAILED with status $BUILD_STATUS"
            exit $BUILD_STATUS
          fi

      - name: Login and push to Docker Hub
        run: |
          echo "Logging into Docker Hub..."
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          echo "Pushing image..."
          docker push ${{ secrets.DOCKER_USERNAME }}/painel-novo:latest
          echo "Push completed"
