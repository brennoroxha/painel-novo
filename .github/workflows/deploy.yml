name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Code pushed successfully
        run: |
          echo "✓ Código enviado para main"
          echo "✓ EasyPanel vai detectar e fazer deploy automaticamente"
          echo ""
          echo "Se EasyPanel não fizer deploy automaticamente:"
          echo "1. Entre no painel EasyPanel"
          echo "2. Vá em Services > painel-novo"
          echo "3. Clique em 'Deploy' ou 'Redeploy'"
