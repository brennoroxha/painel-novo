name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets and environment
        run: |
          echo "Docker version:"
          docker --version
          echo "Checking secrets..."
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "❌ ERRO: DOCKER_USERNAME não está configurado!"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "❌ ERRO: DOCKER_PASSWORD não está configurado!"
            exit 1
          fi
          echo "✓ DOCKER_USERNAME está configurado"
          echo "✓ DOCKER_PASSWORD está configurado"
          echo "Image will be: ${{ secrets.DOCKER_USERNAME }}/painel-novo:latest"

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/painel-novo:latest .
          if [ $? -eq 0 ]; then
            echo "✓ Docker build SUCCESS"
          else
            echo "❌ Docker build FAILED"
            exit 1
          fi

      - name: Login and push to Docker Hub
        run: |
          echo "Logging into Docker Hub..."
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          echo "Pushing image..."
          docker push ${{ secrets.DOCKER_USERNAME }}/painel-novo:latest
          echo "Push completed"
