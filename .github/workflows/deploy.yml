name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Debug info
        run: |
          echo "Checking Docker..."
          docker --version
          echo "Checking Node..."
          node --version
          echo "Dockerfile exists:"
          ls -lah Dockerfile

      - name: Build Docker image
        run: |
          echo "Starting Docker build for ${{ secrets.DOCKER_USERNAME }}/painel-novo:latest"
          docker build -t ${{ secrets.DOCKER_USERNAME }}/painel-novo:latest . 2>&1
          echo "Docker build completed"

      - name: Login and push to Docker Hub
        run: |
          echo "Logging into Docker Hub..."
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          echo "Pushing image..."
          docker push ${{ secrets.DOCKER_USERNAME }}/painel-novo:latest
          echo "Push completed"
